version: '3.8'

services:
  backend:
    image: andremugabo/skitchen-backend:latest
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://user:pass@db:5432/prod
      # Add other environment variables
    depends_on:
      - db
    restart: always
    networks:
      - skitchen-network

  frontend:
    image: andremugabo/skitchen-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - skitchen-network

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - skitchen-network

networks:
  skitchen-network:
    driver: bridge

volumes:
  postgres_data: