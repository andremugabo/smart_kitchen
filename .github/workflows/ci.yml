name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'yarn'
        cache-dependency-path: 'skitchen_backend/yarn.lock'

    - name: Install dependencies
      working-directory: ./skitchen_backend
      run: yarn install --frozen-lockfile

    - name: Lint
      working-directory: ./skitchen_backend
      run: yarn lint || true

    - name: Test
      working-directory: ./skitchen_backend
      env:
        NODE_ENV: test
        DATABASE_URL: postgres://test:test@localhost:5432/test
      run: yarn test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: backend

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'yarn'
        cache-dependency-path: 'skitchen_frontend/yarn.lock'

    - name: Install dependencies
      working-directory: ./skitchen_frontend
      run: yarn install --frozen-lockfile

    - name: Lint
      working-directory: ./skitchen_frontend
      run: yarn lint || true

    - name: Test
      working-directory: ./skitchen_frontend
      run: yarn test

    - name: Build
      working-directory: ./skitchen_frontend
      run: yarn build
